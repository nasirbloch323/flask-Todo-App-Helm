{{- if .Values.secret.create }}
# A Secret holds sensitive data; enable it only when a secure value is supplied.
apiVersion: v1
kind: Secret
metadata:
  # Use a unique Secret name for each Helm release.
  name: {{ include "releaseboard.fullname" . }}-secret
  # Attach standard chart labels.
  labels:
    {{- include "releaseboard.labels" . | nindent 4 }}
# stringData lets Kubernetes encode the plain input value into Secret data.
type: Opaque
stringData:
  # Flask uses this value to sign session cookies; replace it with a strong random key.
  FLASK_SECRET_KEY: {{ required "secret.flaskSecretKey is required when secret.create=true" .Values.secret.flaskSecretKey | quote }}
{{- end }}
