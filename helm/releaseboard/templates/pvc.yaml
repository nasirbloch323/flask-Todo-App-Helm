{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# A PersistentVolumeClaim requests storage from the cluster's storage provisioner.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # The claim name is predictable and unique to this Helm release.
  name: {{ include "releaseboard.fullname" . }}-data
  # Standard labels make the claim easy to identify.
  labels:
    {{- include "releaseboard.labels" . | nindent 4 }}
spec:
  # accessModes controls how the volume may be mounted by nodes.
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  # resources.requests.storage is the capacity requested from the storage system.
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  # An empty class uses the cluster's default StorageClass.
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
