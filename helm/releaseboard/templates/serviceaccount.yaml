{{- if .Values.serviceAccount.create }}
# Create a dedicated identity only when serviceAccount.create is true.
apiVersion: v1
kind: ServiceAccount
metadata:
  # Use the same generated name as the Deployment.
  name: {{ default (include "releaseboard.fullname" .) .Values.serviceAccount.name }}
  # Attach standard labels so this object is easy to find and manage.
  labels:
    {{- include "releaseboard.labels" . | nindent 4 }}
  # Allow cloud-provider annotations such as IAM role bindings.
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Do not automatically mount Kubernetes API credentials unless the app needs them.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
